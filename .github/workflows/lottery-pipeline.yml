name: Eurojackpot Lottery Pipeline

on:
  schedule:
    # Τρίτη & Παρασκευή στις 20:00 UTC = 23:00 EEST (μετά την κλήρωση)
    - cron: '0 20 * * 2'
    - cron: '0 20 * * 5'
  workflow_dispatch:
    inputs:
      force_prediction:
        description: 'Force prediction even if no new draw'
        required: false
        default: 'false'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure data directories exist
        run: |
          mkdir -p data/raw data/processed logs

      - name: Run Lottery Pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_PREDICTION: ${{ github.event.inputs.force_prediction }}
        run: |
          python -m src.main

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
