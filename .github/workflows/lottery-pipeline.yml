name: Eurojackpot Automated Pipeline

on:
  schedule:
    # Τρίτη & Παρασκευή 21:00 UTC = 00:00 Ελλάδας (με θερινή ώρα)
    # Η κλήρωση γίνεται ~19:00 UTC, οπότε 21:00 είναι ασφαλές
    - cron: '0 21 * * 2,5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pipeline
        run: python src/main.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          LOTTERY_EMAIL_USER: ${{ secrets.LOTTERY_EMAIL_USER }}
          LOTTERY_EMAIL_PASS: ${{ secrets.LOTTERY_EMAIL_PASS }}
          LOTTERY_EMAIL_TO: ${{ secrets.LOTTERY_EMAIL_TO }}

      - name: Run Tests
        run: python -m pytest tests/ -v || true
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload Reports & Database
        uses: actions/upload-artifact@v4
        with:
          name: lottery-reports
          path: |
            reports/
            data/
