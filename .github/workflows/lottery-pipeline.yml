name: Eurojackpot Automated Pipeline

on:
  schedule:
    # Τρίτη και Παρασκευή στις 21:00 UTC (00:00 ώρα Ελλάδας)
    - cron: '0 21 * * 2,5'
  workflow_dispatch: # Επιτρέπει και χειροκίνητη εκτέλεση

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch Latest Draw & Update Database
        run: |
          python cli.py fetch

      - name: Generate Predictions
        run: |
          python cli.py predict --primary 7 --euro 3

      - name: Auto-Commit & Push Updated Database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'auto: Update lottery database with latest draw'
          file_pattern: 'data/lottery.db'
