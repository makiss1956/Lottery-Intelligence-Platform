name: Eurojackpot Automated Pipeline

on:
  schedule:
    # Τρίτη & Παρασκευή 21:00 UTC = 00:00 Ελλάδας (με θερινή ώρα)
    - cron: '0 21 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Full Pipeline & Evaluate Predictions
        run: python src/main.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          LOTTERY_EMAIL_USER: ${{ secrets.LOTTERY_EMAIL_USER }}
          LOTTERY_EMAIL_PASS: ${{ secrets.LOTTERY_EMAIL_PASS }}
          LOTTERY_EMAIL_TO: ${{ secrets.LOTTERY_EMAIL_TO }}

      - name: Run Tests
        run: python -m pytest tests/ -v || true
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit and Push Updated Data & Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: New draw data & evaluation reports [skip ci]" && git push)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lottery-reports-and-db
          path: |
            reports/
            data/
