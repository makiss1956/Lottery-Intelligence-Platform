name: Lottery Intelligence Platform Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Εκτέλεση του pipeline κάθε Τρίτη και Παρασκευή στις 21:00 UTC (μετά τις κληρώσεις Eurojackpot)
    - cron: '0 21 * * 2,5'
  workflow_dispatch: # Επιτρέπει τη χειροκίνητη εκτέλεση από το GitHub UI

jobs:
  test-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/checkout@v4
      with:
        python-version: '3.11'

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Pytests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ --doctest-modules --junitxml=junit/test-results.xml --cov=src --cov-report=xml

    - name: Run Main Application Strategy
      if: success() # Εκτελείται μόνο αν όλα τα pytests περάσουν με επιτυχία
      run: |
        python main.py

    - name: Commit and Push DB Updates
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data/lottery.db
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update database and predictions [skip ci]" && git push)
