    enabled: true
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender_email: "your_email@gmail.com"
    sender_password: "your_app_password"  # Google App Password
    recipient_email: "recipient@gmail.com"

paths:
  logs: "logs"
  data: "data"
  cache: ".cache"
  reports: "reports"
